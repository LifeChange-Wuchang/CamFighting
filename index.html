<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0E13">
<title>相機對戰</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<video id="video" playsinline muted></video>
<canvas id="overlay"></canvas>
<canvas id="scanwork" class="offscreen"></canvas>
<div class="flash" id="flash"></div>
<div id="netBadge" class="net-badge hidden">離線 · 重新連線中…</div>

<!-- ========== 首頁 ========== -->
<section class="screen" id="screen-home">
  <div class="sheet">
    <h1 class="logo">相機對戰</h1>
    <p class="sub">用手機鏡頭拍下敵隊頭巾,扣光對方血量</p>
    <input id="homeName" class="field" maxlength="12" placeholder="你的名字" autocomplete="off">
    <div class="row">
      <input id="homeCode" class="field code" maxlength="4" placeholder="房號" autocomplete="off">
      <button id="btnJoin" class="btn primary">加入</button>
    </div>
    <p class="hint">要主持遊戲?請開 <a href="host.html" style="color:var(--text)">主持人控台</a></p>
    <p class="hint" id="homeHint"></p>
  </div>
</section>

<!-- ========== 大廳 ========== -->
<section class="screen hidden" id="screen-lobby">
  <div class="sheet wide">
    <div class="lobby-head">
      <div><div class="label">房號</div><div class="roomcode" id="lobbyCode">----</div></div>
      <div class="badge" id="lobbyStatus">等待開始</div>
    </div>
    <div class="teams-split" id="teamCols"></div>
    <p class="hint" id="lobbyHint">等待主持人開始…</p>
    <button id="btnLeave" class="btn ghost small">離開房間</button>
  </div>
</section>

<!-- ========== 遊戲中 ========== -->
<section class="screen overlay-screen hidden" id="screen-game">
  <div class="hud-top">
    <div class="hpbars" id="hpBars"></div>
    <div class="timer" id="timer">--:--</div>
  </div>
  <div class="tagline"><span id="tagTeam"></span><span id="tagModel"></span></div>
  <ul class="feed" id="feed"></ul>
  <div class="buffs" id="buffs"></div>

  <div class="hud-bottom">
    <button id="btnScan" class="btn round ghost">掃描</button>
    <button id="btnFire" class="shutter" aria-label="開火"><span></span></button>
    <button id="btnMenu" class="btn round ghost">選單</button>
  </div>
  <div class="cooldown" id="cooldownText"></div>

  <div class="shot-result" id="shotResult">
    <div class="sr-title" id="srTitle"></div>
    <div class="sr-detail" id="srDetail"></div>
    <div class="sr-hint">點畫面繼續</div>
  </div>
  <div class="dismiss-layer hidden" id="dismissLayer"></div>
</section>

<!-- ========== 掃描 ========== -->
<section class="screen overlay-screen hidden" id="screen-scan">
  <div class="scan-frame">
    <div class="scan-ring">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" class="ring-bg"/>
        <circle cx="60" cy="60" r="54" class="ring-fg" id="scanRing"/>
      </svg>
    </div>
  </div>
  <div class="scan-info" id="scanInfo">把標記的 QR 碼對準圓框內</div>
  <button id="btnScanClose" class="btn ghost small floating">取消</button>
</section>

<!-- ========== 結算 ========== -->
<section class="screen hidden" id="screen-result">
  <div class="sheet wide">
    <h1 class="winner" id="winnerText">結果</h1>
    <p class="sub" id="endReason"></p>
    <div id="resultScores"></div>
    <h3>個人榜</h3>
    <ol class="leaderboard" id="leaderboard"></ol>
    <p class="hint">等待主持人開下一場,或離開房間</p>
    <button id="btnResultLeave" class="btn ghost small">離開房間</button>
  </div>
</section>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>
<div class="loading hidden" id="loading"><div class="spinner"></div><p id="loadingText">載入中…</p></div>

<script type="module" src="js/ui.js"></script>
</body>
</html>
