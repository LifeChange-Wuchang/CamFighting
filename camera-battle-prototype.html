<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0E13">
<title>相機對戰 · 偵測原型</title>
<style>
  :root{
    --void:#0B0E13;
    --panel:#151A21;
    --red:#FF4757;
    --blue:#3D8BFF;
    --neutral:#9CA8B4;
    --hit:#FFD447;
    --text:#E7ECF2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--void); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  #stage{position:fixed; inset:0;}
  video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; background:#000;
  }
  canvas#overlay{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; pointer-events:none;
  }
  .flash{ position:absolute; inset:0; z-index:15; pointer-events:none; background:#fff; opacity:0; }
  .flash.flash-anim{ animation:flashPop .3s ease-out; }
  @keyframes flashPop{ 0%{opacity:.8;} 100%{opacity:0;} }

  .hidden{ display:none !important; }
  .dismiss-layer{ position:absolute; inset:0; z-index:14; }

  .hud-top{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 14px) 12px calc(env(safe-area-inset-left,0px) + 14px);
    background:linear-gradient(to bottom, rgba(11,14,19,.85), transparent);
    z-index:5;
  }
  .team-toggle{display:flex; gap:6px;}
  .team-btn, .end-btn{
    font-family:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",monospace;
    font-size:12px; letter-spacing:.05em; padding:8px 11px; border-radius:8px;
    border:1.5px solid rgba(255,255,255,.18); background:rgba(21,26,33,.75); color:var(--text);
    pointer-events:auto; white-space:nowrap;
  }
  .team-btn[data-active="true"][data-team="red"]{ background:var(--red); border-color:var(--red); color:#1a0507;}
  .team-btn[data-active="true"][data-team="blue"]{ background:var(--blue); border-color:var(--blue); color:#04101f;}
  .end-btn{ color:var(--neutral); font-size:11px; }

  .hud-right{ display:flex; align-items:center; gap:7px; }
  .hit-counter{
    font-family:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",monospace;
    font-size:12px; letter-spacing:.05em; color:var(--neutral);
    background:rgba(21,26,33,.75); border:1px solid rgba(255,255,255,.14);
    padding:8px 11px; border-radius:8px; white-space:nowrap;
  }
  .hit-counter b{color:var(--hit); font-size:15px;}

  .legend{
    position:absolute; top:60px; left:0; right:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    pointer-events:none; padding:0 12px;
  }
  .legend span{
    font-family:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",monospace;
    font-size:11px; color:var(--neutral); background:rgba(21,26,33,.75);
    padding:5px 10px; border-radius:6px; border:1px solid rgba(255,255,255,.1);
  }
  #modelTag{ font-size:10px; opacity:.75; }

  .reticle-wrap{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:140px; height:140px; z-index:4; pointer-events:none;
  }
  .reticle{width:100%; height:100%;}

  .result-banner{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.94);
    z-index:16; pointer-events:none; max-width:86vw; max-height:72vh; overflow-y:auto;
    font-family:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",monospace;
    text-align:center; padding:14px 18px; border-radius:12px;
    background:rgba(11,14,19,.92); border:1.5px solid rgba(255,255,255,.15);
    opacity:0; transition:opacity .15s ease, transform .15s ease;
  }
  .result-banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .result-title{ font-size:17px; font-weight:700; letter-spacing:.02em; }
  .result-banner.hit .result-title{ color:var(--hit); }
  .result-banner.hit{ border-color:var(--hit); }
  .result-banner.miss .result-title{ color:var(--neutral); }
  .result-detail{
    margin-top:9px; padding-top:9px; border-top:1px solid rgba(255,255,255,.12);
    font-size:11px; line-height:1.7; color:var(--neutral); letter-spacing:.02em;
    word-break:break-word;
  }
  .swatch{
    display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px;
    border:1px solid rgba(255,255,255,.35); margin-right:5px;
  }
  .tap-hint{ margin-top:8px; font-size:10px; color:rgba(156,168,180,.65); }

  .shutter-wrap{
    position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    transform:translateX(-50%); z-index:10;
  }
  .shutter-btn{
    width:74px; height:74px; border-radius:50%;
    border:4px solid var(--text); background:transparent;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; padding:0;
  }
  .shutter-inner{
    width:56px; height:56px; border-radius:50%; background:var(--text);
    transition: transform .1s ease, background .15s ease;
  }
  .shutter-btn:active .shutter-inner{ transform:scale(.8); }
  .shutter-btn:disabled .shutter-inner{ background:var(--neutral); }

  .status-bar{
    position:absolute; left:0; right:0; bottom:116px;
    padding:0 16px; z-index:5; text-align:center; pointer-events:none;
  }
  .status-text{
    font-family:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",monospace;
    font-size:12px; letter-spacing:.03em; color:var(--neutral);
  }

  @media (orientation: landscape){
    .shutter-wrap{
      left:auto; bottom:50%; right:calc(env(safe-area-inset-right,0px) + 26px);
      transform:translateY(50%);
    }
    .status-bar{ bottom:16px; padding:0 130px; }
    .legend{ top:56px; }
    .reticle-wrap{ left:calc(50% - 55px); width:120px; height:120px; }
    .result-banner{ left:calc(50% - 55px); max-height:80vh; }
    .start-overlay{ padding:20px 34px; gap:10px; }
    .start-overlay h1{ font-size:18px; }
    .start-overlay p{ font-size:12.5px; line-height:1.6; max-width:520px; }
    .start-btn{ padding:11px 30px; font-size:15px; margin-top:2px; }
  }

  .start-overlay{
    position:absolute; inset:0; z-index:20; background:var(--void);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px; text-align:center; gap:15px; overflow-y:auto;
  }
  .start-overlay h1{ font-size:21px; margin:0; letter-spacing:.02em; font-weight:700; }
  .start-overlay p{ font-size:14px; line-height:1.7; color:var(--neutral); margin:0; max-width:350px; }
  .start-btn{
    margin-top:6px; font-size:16px; font-weight:700; letter-spacing:.03em;
    padding:14px 34px; border-radius:999px; border:none;
    background:var(--text); color:var(--void); pointer-events:auto;
  }
  .start-btn:active{ transform:scale(.97); }
  .start-btn:disabled{ opacity:.6; }
  .error-text{ color:var(--red); font-size:13px; margin-top:2px; max-width:330px; line-height:1.6; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="flash" id="flash"></div>

  <div id="gameUI" class="hidden">
    <div class="hud-top">
      <div class="team-toggle">
        <button class="team-btn" data-team="red" data-active="true">我方:紅隊</button>
        <button class="team-btn" data-team="blue" data-active="false">我方:藍隊</button>
      </div>
      <div class="hud-right">
        <div class="hit-counter">擊中 <b id="hitCount">0</b></div>
        <button class="end-btn" id="endBtn">結束</button>
      </div>
    </div>

    <div class="legend">
      <span id="legendText">尋找配戴「藍隊」頭巾的敵方臉孔</span>
      <span id="modelTag"></span>
    </div>

    <div class="reticle-wrap">
      <svg class="reticle" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="46" fill="none" stroke="#9CA8B4" stroke-width="2"/>
        <path d="M75 8 L75 28 M75 122 L75 142 M8 75 L28 75 M122 75 L142 75" stroke="#9CA8B4" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="status-bar"><div class="status-text">瞄準對方額頭,按快門拍一張判定</div></div>

    <div class="dismiss-layer hidden" id="dismissLayer"></div>
    <div class="result-banner" id="resultBanner">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="tap-hint">點畫面任一處繼續</div>
    </div>

    <div class="shutter-wrap">
      <button class="shutter-btn" id="shutterBtn" aria-label="拍照判定"><span class="shutter-inner"></span></button>
    </div>
  </div>

  <div class="start-overlay" id="startOverlay">
    <h1>相機對戰 · 偵測原型</h1>
    <p>瞄準對方額頭、按快門拍一張——同時是人臉、又是敵隊頭巾顏色,才算一次有效擊中。判定後會定格並顯示偵測數據,方便你調參數。</p>
    <p>請允許相機權限。橫向直向都可以使用。</p>
    <button class="start-btn" id="startBtn">開始遊戲</button>
    <div class="error-text hidden" id="errorText"></div>
  </div>

  <div class="start-overlay hidden" id="endOverlay">
    <h1>本回合結束</h1>
    <p id="endSummaryText">這次共擊中 0 次,相機已經關閉。</p>
    <button class="start-btn" id="restartBtn">重新開始</button>
  </div>
</div>

<script type="module">
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const flash = document.getElementById('flash');
const gameUI = document.getElementById('gameUI');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const errorText = document.getElementById('errorText');
const endOverlay = document.getElementById('endOverlay');
const endSummaryText = document.getElementById('endSummaryText');
const restartBtn = document.getElementById('restartBtn');
const endBtn = document.getElementById('endBtn');
const shutterBtn = document.getElementById('shutterBtn');
const hitCountEl = document.getElementById('hitCount');
const legendText = document.getElementById('legendText');
const modelTag = document.getElementById('modelTag');
const resultBanner = document.getElementById('resultBanner');
const resultTitle = document.getElementById('resultTitle');
const resultDetail = document.getElementById('resultDetail');
const dismissLayer = document.getElementById('dismissLayer');
const teamBtns = document.querySelectorAll('.team-btn');

const MP_VERSION = '0.10.35';   // 0.10.0 太舊,不支援 full_range 模型(會出現 2304 vs 896 錯誤)
const MODELS = {
  full:  { name:'full range',  url:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/1/blaze_face_full_range.tflite' },
  short: { name:'short range', url:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' }
};
const ZOOM = 2;   // 全畫面找不到臉時,改用中央裁切放大再找一次(數位變焦)

let myTeam = 'red';
let enemyTeam = 'blue';
let hitCount = 0;
let visionFileset = null;
let faceDetector = null;
let activeModel = '';
let mediaStream = null;
let animId = null;
let previewPaused = false;
let shotBusy = false;
let tsCounter = 0;

const zoomCanvas = document.createElement('canvas');
const zctx = zoomCanvas.getContext('2d', { willReadFrequently: true });

// 兩隊的顏色定義:色相(Hue)範圍 + 最低飽和度/亮度門檻。
// 正式使用前務必用實際頭巾材質、在活動當天的燈光下重新測試這幾個數字。
const TEAM_COLORS = {
  red:  { label: '紅隊', hueRanges: [[0,18], [342,360]], sat: 0.35, val: 0.28 },
  blue: { label: '藍隊', hueRanges: [[195,255]],          sat: 0.30, val: 0.28 }
};

teamBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    myTeam = btn.dataset.team;
    enemyTeam = myTeam === 'red' ? 'blue' : 'red';
    teamBtns.forEach(b => b.dataset.active = (b.dataset.team === myTeam) ? 'true' : 'false');
    legendText.textContent = `尋找配戴「${TEAM_COLORS[enemyTeam].label}」頭巾的敵方臉孔`;
  });
});

// MediaPipe 要求時間戳嚴格遞增,所有偵測共用同一個來源
function nextTs(){
  tsCounter = Math.max(tsCounter + 1, Math.round(performance.now()));
  return tsCounter;
}

function rgbToHsv(r, g, b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if (d !== 0){
    if (max===r) h=((g-b)/d)%6;
    else if (max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if (h<0) h+=360;
  }
  const s = max===0 ? 0 : d/max;
  const v = max;
  return [h,s,v];
}

function matchesTeamColor(h,s,v,teamKey){
  const def = TEAM_COLORS[teamKey];
  if (s < def.sat || v < def.val) return false;
  return def.hueRanges.some(([lo,hi]) => h>=lo && h<=hi);
}

function sampleColorNearForehead(box){
  const sx = Math.max(0, Math.round(box.originX + box.width*0.15));
  const sy = Math.max(0, Math.round(box.originY - box.height*0.35));
  const sw = Math.min(canvas.width - sx, Math.round(box.width*0.7));
  const sh = Math.min(canvas.height - sy, Math.round(box.height*0.35));
  if (sw <= 4 || sh <= 4) return null;
  let data;
  try { data = ctx.getImageData(sx, sy, sw, sh).data; }
  catch(e){ return null; }
  let r=0,g=0,b=0,n=0;
  for (let i=0; i<data.length; i+=16){
    r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++;
  }
  if (!n) return null;
  return { r:r/n, g:g/n, b:b/n, rect:{sx,sy,sw,sh} };
}

function syncCanvasSize(){
  if (video.videoWidth && (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight)){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
}

async function initCamera(){
  mediaStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:720} },
    audio: false
  });
  video.srcObject = mediaStream;
  await new Promise(resolve => { video.onloadedmetadata = () => resolve(); });
  await video.play();
  syncCanvasSize();
}

// 建立偵測器並「試跑一次」,確認這個環境真的跑得動這個模型
async function buildDetector(FaceDetector, modelKey){
  const det = await FaceDetector.createFromOptions(visionFileset, {
    baseOptions: { modelAssetPath: MODELS[modelKey].url, delegate: 'GPU' },
    runningMode: 'VIDEO',
    minDetectionConfidence: 0.35   // 放寬一點,較遠/較小的臉也抓得到
  });
  const probe = document.createElement('canvas');
  probe.width = 256; probe.height = 256;
  const pctx = probe.getContext('2d');
  pctx.fillStyle = '#808080';
  pctx.fillRect(0,0,256,256);
  det.detectForVideo(probe, nextTs());   // 不相容的話會在這裡丟錯,而不是等你按快門才爆
  return det;
}

async function initFaceDetector(){
  const { FaceDetector, FilesetResolver } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`);
  visionFileset = await FilesetResolver.forVisionTasks(
    `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`
  );
  try {
    faceDetector = await buildDetector(FaceDetector, 'full');
    activeModel = MODELS.full.name;
  } catch (err){
    console.warn('full range 模型不可用,自動改用 short range:', err);
    faceDetector = await buildDetector(FaceDetector, 'short');
    activeModel = MODELS.short.name + '(full range 不支援,已自動退回)';
  }
  modelTag.textContent = `模型:${activeModel}`;
}

function previewLoop(){
  animId = requestAnimationFrame(previewLoop);
  if (previewPaused || video.readyState < 2) return;
  syncCanvasSize();
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
}

function flashScreen(){
  flash.classList.remove('flash-anim');
  void flash.offsetWidth;
  flash.classList.add('flash-anim');
}

// 第二次嘗試:把畫面中央裁切放大後再偵測,等同數位變焦,讓遠一點的臉變大
function detectZoomed(){
  const cw = Math.round(canvas.width / ZOOM);
  const ch = Math.round(canvas.height / ZOOM);
  const ox = Math.round((canvas.width - cw) / 2);
  const oy = Math.round((canvas.height - ch) / 2);
  zoomCanvas.width = canvas.width;
  zoomCanvas.height = canvas.height;
  zctx.drawImage(video, ox, oy, cw, ch, 0, 0, canvas.width, canvas.height);
  const res = faceDetector.detectForVideo(zoomCanvas, nextTs());
  return (res.detections || []).map(d => ({
    boundingBox: {
      originX: ox + d.boundingBox.originX / ZOOM,
      originY: oy + d.boundingBox.originY / ZOOM,
      width:  d.boundingBox.width / ZOOM,
      height: d.boundingBox.height / ZOOM
    }
  }));
}

function evaluateShot(){
  let detections = (faceDetector.detectForVideo(video, nextTs()).detections) || [];
  let usedZoom = false;
  if (!detections.length){
    detections = detectZoomed();
    usedZoom = detections.length > 0;
  }

  const zoomNote = usedZoom ? '(靠中央放大才找到)' : '';

  if (!detections.length){
    return { hit:false, title:'❌ 沒有擊中',
      detail:`畫面中沒有偵測到人臉<br>模型:${activeModel}<br>已試過全畫面與中央放大兩種方式` };
  }

  const box = detections[0].boundingBox;
  ctx.strokeStyle = 'rgba(231,236,242,.8)';
  ctx.lineWidth = 3;
  ctx.strokeRect(box.originX, box.originY, box.width, box.height);

  const facePct = ((box.width / canvas.width) * 100).toFixed(0);
  const sample = sampleColorNearForehead(box);
  if (!sample){
    return { hit:false, title:'❌ 沒有擊中',
      detail:`偵測到 ${detections.length} 張臉${zoomNote},但額頭位置超出畫面,無法取樣` };
  }

  const [h,s,v] = rgbToHsv(sample.r, sample.g, sample.b);
  const hit = matchesTeamColor(h,s,v,enemyTeam);

  ctx.strokeStyle = hit ? (enemyTeam==='red' ? '#FF4757' : '#3D8BFF') : 'rgba(255,255,255,.65)';
  ctx.lineWidth = 3;
  ctx.strokeRect(sample.rect.sx, sample.rect.sy, sample.rect.sw, sample.rect.sh);

  const rgbCss = `rgb(${Math.round(sample.r)},${Math.round(sample.g)},${Math.round(sample.b)})`;
  const def = TEAM_COLORS[enemyTeam];
  const detail =
    `偵測到 ${detections.length} 張臉${zoomNote} · 臉寬約畫面 ${facePct}%<br>` +
    `<span class="swatch" style="background:${rgbCss}"></span>額頭取樣色 ${rgbCss}<br>` +
    `色相 ${h.toFixed(0)}° · 飽和 ${s.toFixed(2)} · 亮度 ${v.toFixed(2)}<br>` +
    `${def.label}門檻:色相 ${def.hueRanges.map(r=>r.join('-')).join(' 或 ')} · 飽和≥${def.sat} · 亮度≥${def.val}`;

  return {
    hit,
    title: hit ? '🎯 擊中!' : '❌ 沒有擊中',
    detail: hit ? detail : `顏色不符合${def.label}條件<br>${detail}`
  };
}

function showResult(res){
  resultTitle.textContent = res.title;
  resultDetail.innerHTML = res.detail;
  resultBanner.className = 'result-banner show ' + (res.hit ? 'hit' : 'miss');
  dismissLayer.classList.remove('hidden');
}

function dismissResult(){
  if (!shotBusy) return;
  resultBanner.classList.remove('show');
  dismissLayer.classList.add('hidden');
  previewPaused = false;
  shotBusy = false;
  shutterBtn.disabled = false;
}

function takeShot(){
  if (shotBusy || !faceDetector) return;
  shotBusy = true;
  shutterBtn.disabled = true;
  previewPaused = true;
  flashScreen();

  let res;
  try {
    res = evaluateShot();
  } catch (err){
    console.error('偵測失敗:', err);
    res = { hit:false, title:'⚠️ 偵測失敗',
      detail:'判定時發生錯誤,請再試一次<br>' + (err && err.message ? err.message : '') };
  }
  showResult(res);

  if (res.hit){
    hitCount++;
    hitCountEl.textContent = hitCount;
  }
}

function stopCamera(){
  if (animId) cancelAnimationFrame(animId);
  animId = null;
  if (mediaStream){
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  video.srcObject = null;
}

function resetGameUI(){
  resultBanner.classList.remove('show');
  dismissLayer.classList.add('hidden');
  previewPaused = false;
  shotBusy = false;
  shutterBtn.disabled = false;
  hitCount = 0;
  hitCountEl.textContent = '0';
}

async function startGame(){
  startBtn.disabled = true;
  startBtn.textContent = '啟動中…';
  errorText.classList.add('hidden');
  try {
    if (location.protocol !== 'https:' && location.hostname !== 'localhost'){
      throw new Error('相機權限需要在 https 網址下才能使用,請確認網址是 https 開頭。');
    }
    await initCamera();
    if (!faceDetector){
      startBtn.textContent = '載入偵測模型中…';
      await initFaceDetector();
    }
    resetGameUI();
    startOverlay.classList.add('hidden');
    gameUI.classList.remove('hidden');
    previewLoop();
  } catch (err){
    console.error(err);
    stopCamera();
    errorText.textContent = '啟動失敗:' + (err && err.message ? err.message : '無法取得相機權限,請確認已允許相機存取。');
    errorText.classList.remove('hidden');
  } finally {
    startBtn.disabled = false;
    startBtn.textContent = '開始遊戲';
  }
}

shutterBtn.addEventListener('click', takeShot);
dismissLayer.addEventListener('click', dismissResult);

endBtn.addEventListener('click', () => {
  stopCamera();
  resultBanner.classList.remove('show');
  dismissLayer.classList.add('hidden');
  previewPaused = false;
  shotBusy = false;
  shutterBtn.disabled = false;
  gameUI.classList.add('hidden');
  endSummaryText.textContent = `這次共擊中 ${hitCount} 次,相機已經關閉。`;
  endOverlay.classList.remove('hidden');
});

restartBtn.addEventListener('click', () => {
  endOverlay.classList.add('hidden');
  startOverlay.classList.remove('hidden');
});

startBtn.addEventListener('click', startGame);

window.addEventListener('orientationchange', () => setTimeout(syncCanvasSize, 300));
window.addEventListener('resize', syncCanvasSize);
</script>
</body>
</html>
