<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0E13">
  <title>相機對戰 · 射擊原型</title>
  <style>
    :root {
      --void: #0B0E13;
      --panel: #151A21;
      --red: #FF4757;
      --blue: #3D8BFF;
      --neutral: #9CA8B4;
      --hit: #FFD447;
      --text: #E7ECF2;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--void);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    canvas#overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 2;
    }

    .hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
      background: linear-gradient(to bottom, rgba(11, 14, 19, .85), transparent);
      z-index: 5;
    }

    .team-toggle {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .team-btn {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
      font-size: 12px;
      letter-spacing: .06em;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, .18);
      background: rgba(21, 26, 33, .7);
      color: var(--text);
      pointer-events: auto;
      text-align: center;
    }

    .team-btn[data-active="true"][data-team="red"] {
      background: var(--red);
      border-color: var(--red);
      color: #1a0507;
    }

    .team-btn[data-active="true"][data-team="blue"] {
      background: var(--blue);
      border-color: var(--blue);
      color: #04101f;
    }

    .stats-board {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: auto;
    }

    .hit-counter {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
      font-size: 13px;
      letter-spacing: .06em;
      color: var(--neutral);
      background: rgba(21, 26, 33, .7);
      border: 1px solid rgba(255, 255, 255, .14);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .hit-counter b {
      color: var(--hit);
      font-size: 15px;
    }

    .stop-btn {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
      font-size: 12px;
      letter-spacing: .06em;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, .18);
      background: rgba(255, 255, 255, .1);
      color: var(--text);
    }

    .stop-btn:active {
      background: rgba(255, 255, 255, .3);
    }

    .legend {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .legend span {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
      font-size: 11px;
      color: var(--neutral);
      background: rgba(21, 26, 33, .7);
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, .1);
    }

    .reticle-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      z-index: 4;
      pointer-events: none;
    }

    .reticle {
      width: 100%;
      height: 100%;
    }

    .reticle circle,
    .reticle path {
      transition: stroke .15s ease;
    }

    /* 底部狀態與開火區 */
    .bottom-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
      background: linear-gradient(to top, rgba(11, 14, 19, .95) 10%, transparent);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: none;
    }

    .status-text {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
      font-size: 14px;
      letter-spacing: .04em;
      color: var(--neutral);
      min-height: 20px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      transition: color 0.2s;
    }

    /* 開火按鈕 (板機) */
    .shoot-btn-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #FFF;
      padding: 4px;
      pointer-events: auto;
    }

    .shoot-btn {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: none;
      background: #FFF;
      transition: transform 0.1s ease, background 0.2s;
    }

    .shoot-btn:active {
      transform: scale(0.9);
      background: #e0e0e0;
    }

    .shoot-btn.enemy-locked {
      background: var(--hit);
    }

    /* 鎖定敵人時變色 */

    /* 遊戲介面 Overlay (開始 / 結束) */
    .overlay-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: var(--void);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      gap: 16px;
    }

    .overlay-screen h1 {
      font-size: 24px;
      margin: 0;
      letter-spacing: .02em;
      font-weight: 700;
    }

    .overlay-screen p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--neutral);
      margin: 0;
      max-width: 340px;
    }

    .action-btn {
      margin-top: 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .03em;
      padding: 14px 34px;
      border-radius: 999px;
      border: none;
      background: var(--text);
      color: var(--void);
      pointer-events: auto;
    }

    .action-btn:active {
      transform: scale(.97);
    }

    .action-btn:disabled {
      opacity: .6;
    }

    .error-text {
      color: var(--red);
      font-size: 13px;
      margin-top: 4px;
      max-width: 320px;
    }

    /* 開火閃爍特效 */
    .flash-effect {
      position: absolute;
      inset: 0;
      background: white;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
    }

    .flash-effect.active {
      opacity: 0.7;
      transition: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="flash" class="flash-effect"></div>

    <!-- HUD 介面 -->
    <div class="hud-top hidden" id="hud">
      <div class="team-toggle">
        <button class="team-btn" data-team="red" data-active="true">我方:紅隊</button>
        <button class="team-btn" data-team="blue" data-active="false">我方:藍隊</button>
      </div>
      <div class="stats-board">
        <div class="hit-counter">命中 <b id="hitCount">0</b></div>
        <button class="stop-btn" id="stopBtn">結束/休息</button>
      </div>
    </div>

    <div class="legend hidden" id="legend"><span id="legendText">尋找配戴「藍隊」頭巾的敵方臉孔</span></div>

    <div class="reticle-wrap hidden" id="reticle">
      <svg class="reticle" viewBox="0 0 150 150" id="reticleSvg">
        <circle cx="75" cy="75" r="46" fill="none" stroke="#9CA8B4" stroke-width="2" />
        <path d="M75 8 L75 28 M75 122 L75 142 M8 75 L28 75 M122 75 L142 75" stroke="#9CA8B4" stroke-width="2.5"
          stroke-linecap="round" />
      </svg>
    </div>

    <div class="bottom-controls hidden" id="bottomControls">
      <div class="status-text" id="statusText">準備中…</div>
      <div class="shoot-btn-wrap">
        <button class="shoot-btn" id="shootBtn"></button>
      </div>
    </div>

    <!-- 開始畫面 -->
    <div class="overlay-screen" id="startOverlay">
      <h1>相機對戰 · 射擊測試</h1>
      <p>手動開火機制：準星對準配戴敵隊顏色標記的臉部時，按下下方快門按鈕進行射擊！</p>
      <p style="font-size: 13px; color: var(--hit);">※ 為了省電與防止手機發熱，切換分頁或縮小網頁時，相機會自動關閉。</p>
      <button class="action-btn" id="startBtn">啟動相機</button>
      <div class="error-text hidden" id="errorText"></div>
    </div>
  </div>

  <script type="module">
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // UI 元素
    const startOverlay = document.getElementById('startOverlay');
    const hud = document.getElementById('hud');
    const legend = document.getElementById('legend');
    const reticleUI = document.getElementById('reticle');
    const bottomControls = document.getElementById('bottomControls');

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const shootBtn = document.getElementById('shootBtn');
    const flashEl = document.getElementById('flash');
    const errorText = document.getElementById('errorText');
    const statusText = document.getElementById('statusText');
    const hitCountEl = document.getElementById('hitCount');
    const legendText = document.getElementById('legendText');
    const reticleSvg = document.getElementById('reticleSvg');
    const teamBtns = document.querySelectorAll('.team-btn');

    // 遊戲狀態變數
    let myTeam = 'red';
    let enemyTeam = 'blue';
    let hitCount = 0;
    let isPlaying = false;
    let animationFrameId = null;

    // 偵測變數
    let faceDetector = null;
    let frameCounter = 0;
    let lastDetections = [];
    let lastEnemySeen = false;
    let lastSampleRect = null;

    const TEAM_COLORS = {
      red: { label: '紅隊', hueRanges: [[0, 25], [335, 360]], sat: 0.20, val: 0.20 },
      blue: { label: '藍隊', hueRanges: [[190, 260]], sat: 0.20, val: 0.20 }
    };

    // 切換隊伍
    teamBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isPlaying) return; // 遊戲中不給換隊
        myTeam = btn.dataset.team;
        enemyTeam = myTeam === 'red' ? 'blue' : 'red';
        teamBtns.forEach(b => b.dataset.active = (b.dataset.team === myTeam) ? 'true' : 'false');
        legendText.textContent = `尋找配戴「${TEAM_COLORS[enemyTeam].label}」頭巾的敵方臉孔`;
      });
    });

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60; if (h < 0) h += 360;
      }
      const s = max === 0 ? 0 : d / max;
      const v = max;
      return [h, s, v];
    }

    function matchesTeamColor(h, s, v, teamKey) {
      const def = TEAM_COLORS[teamKey];
      if (s < def.sat || v < def.val) return false;
      return def.hueRanges.some(([lo, hi]) => h >= lo && h <= hi);
    }

    function sampleColorNearForehead(box) {
      const sx = Math.max(0, Math.round(box.originX));
      const sy = Math.max(0, Math.round(box.originY - box.height * 0.4));
      const sw = Math.min(canvas.width - sx, Math.round(box.width));
      const sh = Math.min(canvas.height - sy, Math.round(box.height * 0.4));

      if (sw <= 1 || sh <= 1) return null;

      let data;
      try { data = ctx.getImageData(sx, sy, sw, sh).data; }
      catch (e) { return null; }

      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < data.length; i += 16) { // 每4像素取樣
        r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
      }
      if (!n) return null;
      return { r: r / n, g: g / n, b: b / n, rect: { sx, sy, sw, sh } };
    }

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await new Promise(resolve => { video.onloadedmetadata = () => resolve(); });
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    // 徹底關閉相機 (防發熱核心)
    function stopCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
    }

    async function initFaceDetector() {
      if (faceDetector) return;
      const { FaceDetector, FilesetResolver } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      faceDetector = await FaceDetector.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/1/blaze_face_full_range.tflite",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        minDetectionConfidence: 0.4
      });
    }

    function setReticle(color) {
      reticleSvg.querySelectorAll('circle, path').forEach(el => el.setAttribute('stroke', color));
    }

    function drawOverlay() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      if (lastDetections.length) {
        const box = lastDetections[0].boundingBox;
        ctx.strokeStyle = 'rgba(231,236,242,.4)';
        ctx.lineWidth = 2;
        ctx.strokeRect(box.originX, box.originY, box.width, box.height);
      }
      if (lastSampleRect) {
        ctx.strokeStyle = lastEnemySeen ? (enemyTeam === 'red' ? '#FF4757' : '#3D8BFF') : 'rgba(156,168,180,.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(lastSampleRect.sx, lastSampleRect.sy, lastSampleRect.sw, lastSampleRect.sh);
      }
    }

    function updateStatusDisplay() {
      if (lastEnemySeen) {
        setReticle(enemyTeam === 'red' ? '#FF4757' : '#3D8BFF');
        shootBtn.classList.add('enemy-locked');
        statusText.textContent = '🎯 鎖定敵方標記，可開火！';
        statusText.style.color = '#FFF';
      } else if (lastDetections.length > 0) {
        setReticle('#E7ECF2');
        shootBtn.classList.remove('enemy-locked');
        statusText.textContent = '偵測到人臉，未發現敵隊標記';
        statusText.style.color = 'var(--neutral)';
      } else {
        setReticle('#9CA8B4');
        shootBtn.classList.remove('enemy-locked');
        statusText.textContent = '尋找目標中…';
        statusText.style.color = 'var(--neutral)';
      }
    }

    function renderLoop() {
      if (!isPlaying) return;
      animationFrameId = requestAnimationFrame(renderLoop);
      if (video.readyState < 2) return;

      frameCounter++;
      if (faceDetector && frameCounter % 3 === 0) {
        const result = faceDetector.detectForVideo(video, performance.now());
        lastDetections = result.detections || [];

        let enemySeenNow = false;
        lastSampleRect = null;

        if (lastDetections.length) {
          const sample = sampleColorNearForehead(lastDetections[0].boundingBox);
          if (sample) {
            lastSampleRect = sample.rect;
            const [h, s, v] = rgbToHsv(sample.r, sample.g, sample.b);
            enemySeenNow = matchesTeamColor(h, s, v, enemyTeam);
          }
        }
        lastEnemySeen = enemySeenNow;
        updateStatusDisplay();
      }
      drawOverlay();
    }

    async function startGame() {
      startBtn.disabled = true;
      startBtn.textContent = '啟動相機中…';
      errorText.classList.add('hidden');

      try {
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
          throw new Error('相機權限需在 HTTPS 或 Localhost 環境下運作。');
        }
        await initCamera();
        statusText.textContent = '載入模型中…';
        await initFaceDetector();

        // (可選) 在這裡把 hitCount = 0 若你想每次啟動都歸零
        // hitCount = 0; hitCountEl.textContent = hitCount;

        isPlaying = true;

        // 切換介面
        startOverlay.classList.add('hidden');
        hud.classList.remove('hidden');
        legend.classList.remove('hidden');
        reticleUI.classList.remove('hidden');
        bottomControls.classList.remove('hidden');

        renderLoop();
      } catch (err) {
        console.error(err);
        errorText.textContent = '啟動失敗:' + (err && err.message ? err.message : '無法取得相機權限。');
        errorText.classList.remove('hidden');
        startBtn.disabled = false;
        startBtn.textContent = '重試';
      }
    }

    // 結束/暫停遊戲
    function stopGame(isAuto = false) {
      if (!isPlaying) return;
      isPlaying = false;
      cancelAnimationFrame(animationFrameId);

      // 切斷相機電源，徹底防發熱
      stopCamera();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 藏起遊戲介面，顯示開始畫面
      hud.classList.add('hidden');
      legend.classList.add('hidden');
      reticleUI.classList.add('hidden');
      bottomControls.classList.add('hidden');
      startOverlay.classList.remove('hidden');

      startBtn.disabled = false;
      if (isAuto) {
        startBtn.textContent = '繼續 (之前已自動暫停)';
        errorText.textContent = '偵測到離開畫面，相機已自動關閉以節省電量。';
        errorText.style.color = 'var(--hit)'; // 綠/黃色提示
        errorText.classList.remove('hidden');
      } else {
        startBtn.textContent = '重新啟動相機';
        errorText.classList.add('hidden');
      }
    }

    // --- 事件綁定 ---

    startBtn.addEventListener('click', startGame);

    // 手動結束按鈕
    stopBtn.addEventListener('click', () => stopGame(false));

    // 【重點】Page Visibility API - 當網頁縮小、切換分頁或關閉螢幕時，立刻斷開相機！
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isPlaying) {
        stopGame(true);
      }
    });

    // 射擊 (板機) 處理
    shootBtn.addEventListener('click', () => {
      if (!isPlaying) return;

      flashEl.classList.add('active');
      setTimeout(() => flashEl.classList.remove('active'), 50);

      if (lastEnemySeen) {
        hitCount++;
        hitCountEl.textContent = hitCount;
        statusText.textContent = '💥 擊中！';
        statusText.style.color = 'var(--hit)';

        shootBtn.style.background = 'var(--hit)';
        setTimeout(() => shootBtn.style.background = '', 200);
      } else {
        statusText.textContent = '❌ Miss! (未瞄準敵方標記)';
        statusText.style.color = 'var(--red)';
      }
    });
  </script>
</body>

</html>
